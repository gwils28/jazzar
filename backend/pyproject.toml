[project]
name = "jazzar"
version = "0.1.0"
description = "Jazzar — moteur de recherche, dossiers agentiques et data-journalisme sur 90 ans d'archives jazz"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=1.0",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "pymupdf>=1.24",
    "typer>=0.12",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
jazzar = "jazzar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jazzar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"jazzar/cli.py" = ["B008"]  # idiome typer : Option/Argument en valeur par défaut

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]
